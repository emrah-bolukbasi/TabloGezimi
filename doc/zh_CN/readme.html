<!doctype html><html lang="zh_CN"><head><meta charset="utf-8"><title>表格导航 1.1.10</title></head><body><h1>表格导航 1.1.10</h1><p>支持 Excel、浏览器及无障碍 PDF 和文档中的表格导航。</p><h2>表格导航</h2><p>按 Alt+Shift+O 开启或关闭。上、下方向键朗读整行及列标题，左、右方向键移动单元格。</p><p>Alt+Shift+上复制行，下复制表格，左复制列，右复制单元格。</p><p>扫描版 PDF 需要额外 OCR。</p></body></html>
